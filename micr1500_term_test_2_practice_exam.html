<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICR1500 Term Test 2 Practice Exam</title>
  <style>
:root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-border: #16a34a;
            --correct-bg: #f0fdf4;
            --correct-text: #15803d;
            --wrong-border: #dc2626;
            --wrong-bg: #fef2f2;
            --wrong-text: #b91c1c;
            --partial-border: #d97706;
            --partial-bg: #fffbeb;
            --partial-text: #92400e;
            --border-color: #e2e8f0;
            --selected-border: #93c5fd;
            --selected-bg: #eff6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Navigation / Filter Bar */
        .nav-bar {
            max-width: 800px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-bar::-webkit-scrollbar { display: none; }

        .filter-btn,
        .reset-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .filter-btn:hover,
        .reset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Main Container */
        main {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 16px;
        }

        /* Question Cards */
        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .q-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .q-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .q-cat {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.45;
        }

        /* Options */
        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .opt-btn:active:not(:disabled) { background-color: #f1f5f9; }

        .opt-prefix {
            font-weight: 700;
            margin-right: 8px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .opt-btn.selected {
            border-color: var(--selected-border);
            background: var(--selected-bg);
            color: #1d4ed8;
        }

        .q-card.answered .opt-btn {
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .q-card.answered .opt-btn.user-correct,
        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        /* PATH2200 Submit */
        .submit-q-btn {
            margin-top: 14px;
            padding: 9px 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        .submit-q-btn:hover:not(:disabled) { opacity: 0.92; }
        .submit-q-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-q-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .feedback-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .feedback-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-border);
            color: var(--correct-text);
        }

        .feedback-box.incorrect {
            background-color: var(--wrong-bg);
            border-left: 4px solid var(--wrong-border);
            color: var(--wrong-text);
        }

        .feedback-box.partial {
            background-color: var(--partial-bg);
            border-left: 4px solid var(--partial-border);
            color: var(--partial-text);
        }

        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        .explanation { margin-top: 4px; color: inherit; }

        @media (max-width: 640px) {
            header { padding: 10px 12px; }
            .header-title h1 { font-size: 1rem; }
            .header-title p { font-size: 0.7rem; }
            .score-badge { padding: 5px 10px; font-size: 0.8rem; }
            .nav-bar { padding: 0 12px; margin-top: 12px; }
            main { margin-top: 12px; padding: 0 12px; }
            .q-card { padding: 16px; }
            .q-text { font-size: 0.95rem; }
            .opt-btn { font-size: 0.9rem; padding: 11px 12px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-title">
                <h1>MICR1500 Term Test 2 Practice Exam</h1>
                <p id="header-subtitle">124 Questions • 4 Lecture Sections</p>
            </div>
            <div class="score-badge" id="score-counter">
                Grade: 100%
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navTabs">
        <button class="filter-btn active" data-lec="all" type="button">All (124)</button>
        <button class="filter-btn" data-lec="5" type="button">Lec 5: Infection &amp; Epidemiology (35)</button>
        <button class="filter-btn" data-lec="6" type="button">Lec 6: Control of Microbes (34)</button>
        <button class="filter-btn" data-lec="7" type="button">Lec 7: Antibiotics (26)</button>
        <button class="filter-btn" data-lec="8" type="button">Lec 8: Antivirals &amp; Superbugs (29)</button>
        <button class="reset-btn" id="resetBtn" type="button">Reset</button>
    </div>

    <main id="questionsContainer"></main>

    <script>
    // QUESTION BANK DATA
    // ---------------------------------------------------------
    const questionBank = [

      // ==========================================
      // LECTURE 5: Infection, Transmission, Epidemiology & Pathogenicity
      // ==========================================
      {
        lec: 5,
        type: "mcq",
        text: "Two organisms live together and both benefit, as with E. coli in the human gut. This relationship is called:",
        options: [
          { text: "Commensalism", correct: false },
          { text: "Mutualism", correct: true },
          { text: "Synergism", correct: false },
          { text: "Parasitism", correct: false }
        ],
        explanation: "Both benefit = mutualism. Commensalism leaves one partner unaffected; synergism is 1+1=3; parasitism harms one partner."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Trench mouth is an example of microbes together causing more harm than either alone (1+1=3). This is:",
        options: [
          { text: "Mutualism", correct: false },
          { text: "Commensalism", correct: false },
          { text: "Synergism", correct: true },
          { text: "Parasitism", correct: false }
        ],
        explanation: "Organisms that do more together than alone (1+1=3; trench mouth) = synergism."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which body site should normally be free of resident microbes?",
        options: [
          { text: "Large intestine", correct: false },
          { text: "Skin", correct: false },
          { text: "Mouth", correct: false },
          { text: "Central nervous system", correct: true }
        ],
        explanation: "The CNS (like blood, internal organs and bladder) should be sterile. Intestine, skin and mouth have normal flora."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which organism and site produce vitamin K needed for blood clotting?",
        options: [
          { text: "Staphylococci on the skin", correct: false },
          { text: "Lactobacilli in the genital tract", correct: false },
          { text: "E. coli in the large intestine", correct: true },
          { text: "Spirochetes in the mouth", correct: false }
        ],
        explanation: "E. coli in the large intestine makes vitamin K, which is needed for blood clotting."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Urinary tract infections, yeast vaginitis and colitis are usually the result of:",
        options: [
          { text: "Destruction or translocation of normal flora", correct: true },
          { text: "Acquisition of flora at birth", correct: false },
          { text: "The beneficial effects of normal flora", correct: false },
          { text: "A fetus being exposed to microbes in the womb", correct: false }
        ],
        explanation: "Destruction or translocation of normal flora usually results in infection (UTI, yeast vaginitis, colitis, toxic shock, wound infections)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "HIV versus AIDS illustrates that:",
        options: [
          { text: "Infection and disease are the same thing", correct: false },
          { text: "A person can be infected without having the disease", correct: true },
          { text: "Disease always comes before infection", correct: false },
          { text: "Pathogenicity is the same as incubation", correct: false }
        ],
        explanation: "Infection ≠ disease: HIV infection can exist without AIDS (the disease)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which statement correctly defines virulence?",
        options: [
          { text: "Ability of a microbe to live in a host without harm", correct: false },
          { text: "The first or original illness", correct: false },
          { text: "Any change from a state of good health", correct: false },
          { text: "The degree of pathogenicity", correct: true }
        ],
        explanation: "Virulence = the degree of pathogenicity ('full of poison')."
      },
      {
        lec: 5,
        type: "mcq",
        text: "A child has a measles rash at the hairline and face at the peak of illness. Which stage is this?",
        options: [
          { text: "Acme, the most communicable period", correct: true },
          { text: "Prodromal period", correct: false },
          { text: "Decline period", correct: false },
          { text: "Convalescent period", correct: false }
        ],
        explanation: "Rash at hairline/face with peak symptoms = acme, the most transmissible period."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which disease below has the longest incubation period?",
        options: [
          { text: "Influenza", correct: false },
          { text: "Hepatitis B", correct: false },
          { text: "Syphilis", correct: false },
          { text: "Leprosy", correct: true }
        ],
        explanation: "Leprosy: 10 to > 30 years. Influenza 1 d, hep B 1-6 months, syphilis 2-4 weeks."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Symptoms are decreasing and the patient is sweating after a fever. Which stage is this?",
        options: [
          { text: "Incubation", correct: false },
          { text: "Acme", correct: false },
          { text: "Decline", correct: true },
          { text: "Convalescence", correct: false }
        ],
        explanation: "Decreasing symptoms and sweating after fever = decline period."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which of the following is an example of indirect (vehicle) transmission?",
        options: [
          { text: "Kissing", correct: false },
          { text: "A bite from a rabid dog", correct: false },
          { text: "Touching a contaminated doorknob (fomite)", correct: true },
          { text: "Rubella passed from mother to fetus", correct: false }
        ],
        explanation: "A doorknob is a fomite (inanimate object), which is indirect/vehicle transmission. Kissing, animal bites and congenital transfer are direct."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Larger respiratory droplets (> 5-10 µm) typically fall to the ground within about:",
        options: [
          { text: "10 cm", correct: false },
          { text: "1-2 m", correct: true },
          { text: "7-8 m", correct: false },
          { text: "20 m", correct: false }
        ],
        explanation: "Larger droplets fall within 1-2 m; the sneeze gas cloud can travel 7-8 m."
      },
      {
        lec: 5,
        type: "mcq",
        text: "A mosquito that carries West Nile virus from one host to another is a:",
        options: [
          { text: "Vector", correct: true },
          { text: "Fomite", correct: false },
          { text: "Asymptomatic carrier", correct: false },
          { text: "Nonliving reservoir", correct: false }
        ],
        explanation: "Mosquitoes are live arthropods acting as vectors (West Nile, malaria)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "A human carrier of a pathogen is best described as someone who:",
        options: [
          { text: "Has severe symptoms and is only infectious at the acme", correct: false },
          { text: "Is an inanimate object that carries pathogens", correct: false },
          { text: "Is an arthropod that transmits disease", correct: false },
          { text: "Is colonized, shows no symptoms, and can spread the disease", correct: true }
        ],
        explanation: "Carriers are colonized, asymptomatic, and can spread disease to many people."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Rubella passed from a pregnant mother to her fetus across the placenta is an example of:",
        options: [
          { text: "Droplet transmission", correct: false },
          { text: "Congenital transfer", correct: true },
          { text: "Vector-borne transmission", correct: false },
          { text: "Fomite transmission", correct: false }
        ],
        explanation: "Mother-to-child via the placenta or birth canal = congenital transfer (rubella, herpes)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Incidence is calculated as:",
        options: [
          { text: "All cases (old and new) divided by the number of people at risk", correct: false },
          { text: "New cases divided by the number of people at risk", correct: true },
          { text: "Deaths divided by the number of people at risk", correct: false },
          { text: "Old cases divided by new cases", correct: false }
        ],
        explanation: "Incidence = new cases ÷ number at risk. Option A is prevalence."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which relationship is always true?",
        options: [
          { text: "Prevalence > incidence", correct: true },
          { text: "Incidence > prevalence", correct: false },
          { text: "Mortality rate > incidence", correct: false },
          { text: "Prevalence < mortality rate", correct: false }
        ],
        explanation: "Prevalence (old + new) is always > incidence (new only). Incidence > mortality is not always true (e.g., a new vaccine lowers new cases)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "A disease that is constantly present at a low level in a geographical area (e.g., the common cold) is:",
        options: [
          { text: "Sporadic", correct: false },
          { text: "Epidemic", correct: false },
          { text: "Endemic", correct: true },
          { text: "Pandemic", correct: false }
        ],
        explanation: "Constant low-level presence in an area = endemic (common cold, hepatitis A)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "An epi curve shows sequential humps that grow over time from an index case. This indicates:",
        options: [
          { text: "A point-source outbreak", correct: false },
          { text: "A continuing-source outbreak", correct: false },
          { text: "A disseminated (propagated) person-to-person outbreak", correct: true },
          { text: "An endemic baseline", correct: false }
        ],
        explanation: "Sequential growing humps = disseminated (propagated) person-to-person spread (e.g., SARS-CoV curve)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "According to the WHO, a pandemic requires:",
        options: [
          { text: "Any outbreak in a single country", correct: false },
          { text: "A few scattered sporadic cases", correct: false },
          { text: "An epidemic confined to one WHO region", correct: false },
          { text: "Community-level spread in multiple countries in two or more WHO regions", correct: true }
        ],
        explanation: "WHO: pandemic = community-level spread in multiple countries in ≥ 2 WHO regions."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which of the following is a non-communicable disease?",
        options: [
          { text: "Tetanus", correct: true },
          { text: "Chlamydia", correct: false },
          { text: "Cholera", correct: false },
          { text: "MRSA", correct: false }
        ],
        explanation: "Tetanus cannot spread person to person. Chlamydia, cholera and MRSA are communicable."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Virus present in the bloodstream is called:",
        options: [
          { text: "Bacteremia", correct: false },
          { text: "Septicemia", correct: false },
          { text: "A local infection", correct: false },
          { text: "Viremia", correct: true }
        ],
        explanation: "Viremia = virus in blood; bacteremia/septicemia = bacteria in blood."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Pneumonia that develops in a weakened patient following influenza is a:",
        options: [
          { text: "Primary infection", correct: false },
          { text: "Secondary infection", correct: true },
          { text: "Chronic infection", correct: false },
          { text: "Local infection only", correct: false }
        ],
        explanation: "A new infection in a weakened person following another infection = secondary infection (pneumonia after influenza)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which list gives the top three nosocomial infection types in the correct order with correct percentages?",
        options: [
          { text: "UTI 40%, surgical sites 19%, respiratory 15%", correct: true },
          { text: "Respiratory 40%, UTI 19%, surgical sites 15%", correct: false },
          { text: "Surgical sites 40%, UTI 19%, skin 15%", correct: false },
          { text: "UTI 40%, respiratory 19%, surgical sites 15%", correct: false }
        ],
        explanation: "Correct order: UTI 40% > surgical sites 19% > respiratory 15%."
      },
      {
        lec: 5,
        type: "mcq",
        text: "The most important control measure for nosocomial infections is:",
        options: [
          { text: "Giving prophylactic antibiotics to every patient", correct: false },
          { text: "Isolating all hospital staff", correct: false },
          { text: "Universal precautions, including proper handwashing", correct: true },
          { text: "Eliminating every patient's normal flora", correct: false }
        ],
        explanation: "Universal precautions with proper handwashing is the key control. Other options are incorrect or harmful."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which organism has the lowest infectious dose (fewest organisms needed to cause infection)?",
        options: [
          { text: "Typhoid bacilli (about 200,000)", correct: false },
          { text: "Cholera bacteria (about 2,000,000)", correct: false },
          { text: "Typical E. coli (about 1,000,000)", correct: false },
          { text: "E. coli O157:H7 (< 10)", correct: true }
        ],
        explanation: "E. coli O157:H7 needs < 10 organisms (typhoid 200,000; cholera 2,000,000; typical E. coli 1,000,000)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "What does streptokinase, produced by Streptococcus pyogenes, do?",
        options: [
          { text: "Clots plasma to form a protective wall", correct: false },
          { text: "Dissolves blood clots", correct: true },
          { text: "Destroys red blood cells", correct: false },
          { text: "Dissolves hyaluronic acid", correct: false }
        ],
        explanation: "Kinases (e.g., streptokinase) dissolve blood clots. Coagulase clots plasma; hemolysins lyse RBCs; hyaluronidase dissolves tissue glue."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which enzyme dissolves \"tissue glue\" and helps flesh-eating strep and gas gangrene spread rapidly?",
        options: [
          { text: "Coagulase", correct: false },
          { text: "Hemolysin", correct: false },
          { text: "Hyaluronidase", correct: true },
          { text: "Leukocidin", correct: false }
        ],
        explanation: "Hyaluronidase dissolves hyaluronic acid (tissue glue), allowing rapid spread."
      },
      {
        lec: 5,
        type: "mcq",
        text: "A toxin that is LPS, is released when a Gram-negative cell dies, has low potency and nonspecific effects is a(n):",
        options: [
          { text: "Endotoxin", correct: true },
          { text: "Exotoxin", correct: false },
          { text: "Adhesin", correct: false },
          { text: "Coagulase", correct: false }
        ],
        explanation: "LPS, released on death, low potency, nonspecific = endotoxin (Gram-negative)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Clusters of virulence genes called pathogenicity islands are transferred between bacteria by:",
        options: [
          { text: "Binary fission", correct: false },
          { text: "Mutation only", correct: false },
          { text: "Vaccination", correct: false },
          { text: "Horizontal gene transfer (e.g., plasmids and sex pili)", correct: true }
        ],
        explanation: "Pathogenicity islands move by horizontal gene transfer (plasmids, sex pili)."
      },

      // SOCRATIVE ADDITIONS - LECTURE 5
      {
        lec: 5,
        type: "sata",
        text: "During which of the following stages of infectious disease is the microbe transmissible? (SATA)",
        options: [
          { text: "Incubation period", correct: true },
          { text: "Period of prodromal symptoms", correct: true },
          { text: "Period of acme", correct: true },

        text: "How does Tazobactam or Sulbactam help us fight superbugs?",
        options: [
          { text: "they open pores in cell membranes", correct: false },
          { text: "they inhibit protein synthesis", correct: false },
          { text: "they inhibit penicillinase", correct: true },
          { text: "they inhibit sterol synthesis", correct: false }
        ],
        explanation: "Tazobactam and Sulbactam inhibit penicillinase (beta-lactamase), which makes bacteria susceptible to penicillin again."
      }
    ];

    // ---------------------------------------------------------
    // TEST LOGIC: shuffled lecture sets, filters, Submit, SATA partial credit
    // ---------------------------------------------------------
    let currentLec = "all";
    let shuffledQuestions = [];
    let activeQuestions = [];
    // keyed by stable question id (the original position in questionBank)
    const userState = new Map();

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildShuffledQuestionSet() {
        // Shuffle each lecture independently so every lecture is randomized,
        // then shuffle the complete set so All mixes lectures and question types.
        const grouped = [];
        const lectureNumbers = [...new Set(questionBank.map(q => q.lec))].sort((a, b) => a - b);
        for (const lec of lectureNumbers) {
            const lectureQuestions = questionBank
                .map((q, index) => ({ ...q, qid: index }))
                .filter(q => q.lec === lec);
            grouped.push(...shuffleArray(lectureQuestions).map(q => ({
                ...q,
                options: shuffleArray(q.options)
            })));
        }
        shuffledQuestions = shuffleArray(grouped);
    }

    function setActiveQuestions(lec) {
        currentLec = lec;
        activeQuestions = lec === "all"
            ? [...shuffledQuestions]
            : shuffledQuestions.filter(q => q.lec === Number(lec));
    }

    function resetAttempt() {
        userState.clear();
        buildShuffledQuestionSet();
        setActiveQuestions(currentLec);
        renderQuestions();
        updateScore();
    }

    function filterQuestions(lec, button) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        setActiveQuestions(lec);
        renderQuestions();
        updateScore();
    }

    function updateScore() {
        const totalQuestions = activeQuestions.length;
        if(totalQuestions === 0) {
            document.getElementById('score-counter').textContent = `Grade: 100%`;
            return;
        }

        // Calculate points lost just for the active set
        let activePointsLost = 0;
        let submittedCount = 0;
        
        activeQuestions.forEach(q => {
            const state = userState.get(q.qid);
            if(state && state.submitted) {
                submittedCount++;
                activePointsLost += (1 - state.score);
            }
        });

        // Starts at 100% and subtracts proportional value of missed questions
        let currentGrade = Math.max(0, Math.round(((totalQuestions - activePointsLost) / totalQuestions) * 100));
        
        const scoreElem = document.getElementById('score-counter');
        scoreElem.textContent = `Grade: ${currentGrade}%`;
        scoreElem.title = `Answered ${submittedCount} / ${totalQuestions}`;
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

        activeQuestions.forEach((q, displayIndex) => {
            const state = userState.get(q.qid) || { submitted: false, selected: [], score: 0 };
            const card = document.createElement('div');
            card.className = 'q-card';
            card.id = `qcard-${q.qid}`;

            if (state.submitted) {
                card.classList.add('answered');
                if (state.score === 1) card.classList.add('is-correct');
                else if (state.score > 0) card.classList.add('is-partial');
                else card.classList.add('is-wrong');
            }

            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                let extraClass = '';
                if (state.submitted) {
                    if (opt.correct && state.score === 1) extraClass = 'user-correct';
                    else if (opt.correct) extraClass = 'reveal-correct';
                    else if (state.selected.includes(optIndex)) extraClass = 'user-wrong';
                } else if (state.selected.includes(optIndex)) {
                    extraClass = 'selected';
                }

                optionsHTML += `
                    <button type="button" class="opt-btn ${extraClass}"
                            ${state.submitted ? 'disabled' : ''}
                            onclick="handleOptionClick(${q.qid}, ${optIndex})">
                        <span class="opt-prefix">${letters[optIndex]}.</span>
                        <span>${escapeHTML(opt.text)}</span>
                    </button>
                `;
            });

            const badge = q.type === 'sata' ? 'SATA' : 'MCQ';
            const submitDisabled = state.submitted || state.selected.length === 0 ? 'disabled' : '';
            const buttonText = state.submitted ? 'Submitted' : 'Submit Answer';

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">Question ${displayIndex + 1}</span>
                    <span class="q-cat">${badge}</span>
                </div>
                <div class="q-text">${escapeHTML(q.text)}</div>
                <div class="opt-list">${optionsHTML}</div>
                <button class="submit-q-btn" id="btn_${q.qid}" ${submitDisabled}
                        onclick="submitAnswer(${q.qid})">${buttonText}</button>
                <div class="feedback-box" id="feedback_${q.qid}"></div>
            `;

            container.appendChild(card);
            if (state.submitted) showFeedback(q.qid);
        });
    }

    function handleOptionClick(qid, optIndex) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        if (!q) return;

        const existing = userState.get(qid) || { submitted: false, selected: [], score: 0 };
        if (existing.submitted) return;

        let selected;
        if (q.type === 'mcq') {
            selected = [optIndex];
        } else {
            selected = [...existing.selected];
            const index = selected.indexOf(optIndex);
            if (index >= 0) selected.splice(index, 1);
            else selected.push(optIndex);
        }

        userState.set(qid, { submitted: false, selected, score: 0 });
        renderQuestions();
    }

    function submitAnswer(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        if (!q || !state || state.selected.length === 0 || state.submitted) return;

        state.submitted = true;

        if (q.type === 'mcq') {
            state.score = q.options[state.selected[0]]?.correct ? 1 : 0;
        } else {
            const totalCorrect = q.options.filter(option => option.correct).length;
            let correctSelected = 0;
            let incorrectSelected = 0;

            state.selected.forEach(index => {
                if (q.options[index]?.correct) correctSelected++;
                else incorrectSelected++;
            });

            // Partial-credit scoring requested for SATA questions:
            // +1/N for each correct selection, -1/N for each incorrect selection,
            // with a minimum of 0 and a maximum of 1.
            state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
        }

        userState.set(qid, state);
        updateScore();
        renderQuestions();
    }

    function showFeedback(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        const fbBox = document.getElementById(`feedback_${qid}`);
        if (!q || !state || !fbBox) return;

        let statusClass = 'incorrect';
        let titleText = '✗ Incorrect';

        if (state.score === 1) {
            statusClass = 'correct';
            titleText = '✓ Correct!';
        } else if (state.score > 0) {
            statusClass = 'partial';
            titleText = `Partial Credit (+${state.score.toFixed(2)})`;
        }

        fbBox.className = `feedback-box ${statusClass}`;
        fbBox.style.display = 'block';
        fbBox.innerHTML = `
            <div class="feedback-title">${titleText}</div>
            <div class="explanation">${escapeHTML(q.explanation)}</div>
        `;
    }

    function escapeHTML(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    document.getElementById('navTabs').addEventListener('click', event => {
        const button = event.target.closest('.filter-btn');
        if (!button) return;
        filterQuestions(button.dataset.lec, button);
    });

    document.getElementById('resetBtn').addEventListener('click', resetAttempt);

    // Default state: All questions visible, shuffled on page load.
    buildShuffledQuestionSet();
    setActiveQuestions('all');
    renderQuestions();
    updateScore();

    </script>
</body>
</html>
